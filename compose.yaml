services:
  mysql:
    image: mysql:${MYSQL_IMAGE_TAG:-8.4}
    container_name: djgear_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      # Localhost-only database administration access (never exposed on 0.0.0.0)
      - "127.0.0.1:${MYSQL_LOCAL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/docker/mysql/my.cnf:/etc/mysql/conf.d/zz-djgear.cnf:ro
    networks:
      - djgear_backend
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7.4-alpine}
    container_name: djgear_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - "redis-server"
      - "/usr/local/etc/redis/redis.conf"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
    # Intentionally publishes ZERO host ports; accessible only within djgear_backend
    volumes:
      - redis_data:/data
      - ./infrastructure/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - djgear_backend
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:${MAILPIT_IMAGE_TAG:-v1}
    container_name: djgear_mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "500"
    ports:
      # Web UI bound strictly to localhost; SMTP (1025) remains private to djgear_backend
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    networks:
      - djgear_backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8025/livez || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  wordpress:
    build:
      context: ./infrastructure/docker/wordpress
      dockerfile: Dockerfile
      args:
        WP_IMAGE_TAG: ${WP_IMAGE_TAG:-7.1.5-php8.3-fpm}
    image: djgear/wordpress:${WP_IMAGE_TAG:-7.1.5-php8.3-fpm}
    container_name: djgear_wordpress
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-djg_}
      WORDPRESS_DEBUG: ${WP_DEBUG:-true}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-development}
      WP_DEBUG_LOG: ${WP_DEBUG_LOG:-true}
      WP_DEBUG_DISPLAY: ${WP_DEBUG_DISPLAY:-false}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-djgear_dev_}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@djgear.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-DJGear Local}
      DJGEAR_SMS_PROVIDER: ${DJGEAR_SMS_PROVIDER:-mock}
      DJGEAR_PAYMENT_MODE: ${DJGEAR_PAYMENT_MODE:-sandbox}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', getenv('WP_ENVIRONMENT_TYPE') ?: 'development');
        define('WP_DEBUG_LOG', filter_var(getenv('WP_DEBUG_LOG'), FILTER_VALIDATE_BOOLEAN));
        define('WP_DEBUG_DISPLAY', filter_var(getenv('WP_DEBUG_DISPLAY'), FILTER_VALIDATE_BOOLEAN));
        define('DISALLOW_FILE_EDIT', true);
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_MAX_MEMORY_LIMIT', '256M');
        define('WP_REDIS_HOST', getenv('REDIS_HOST') ?: 'redis');
        define('WP_REDIS_PORT', (int) (getenv('REDIS_PORT') ?: 6379));
        define('WP_REDIS_PASSWORD', getenv('REDIS_PASSWORD') ?: '');
        define('WP_REDIS_DATABASE', (int) (getenv('REDIS_DATABASE') ?: 0));
        define('WP_REDIS_PREFIX', getenv('REDIS_PREFIX') ?: 'djgear_dev_');
        define('DJGEAR_SMS_PROVIDER', getenv('DJGEAR_SMS_PROVIDER') ?: 'mock');
        define('DJGEAR_PAYMENT_MODE', getenv('DJGEAR_PAYMENT_MODE') ?: 'sandbox');
    volumes:
      - wp_core:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./wp-content/plugins/djgear-core:/var/www/html/wp-content/plugins/djgear-core
      - ./wp-content/plugins/djgear-dashboard:/var/www/html/wp-content/plugins/djgear-dashboard
      - ./wp-content/plugins/djgear-device-catalog:/var/www/html/wp-content/plugins/djgear-device-catalog
    networks:
      - djgear_frontend
      - djgear_backend
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  nginx:
    image: nginx:${NGINX_IMAGE_TAG:-1.30-alpine}
    container_name: djgear_nginx
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:80"
    volumes:
      - wp_core:/var/www/html:ro
      - wp_uploads:/var/www/html/wp-content/uploads:ro
      - ./wp-content/plugins/djgear-core:/var/www/html/wp-content/plugins/djgear-core:ro
      - ./wp-content/plugins/djgear-dashboard:/var/www/html/wp-content/plugins/djgear-dashboard:ro
      - ./wp-content/plugins/djgear-device-catalog:/var/www/html/wp-content/plugins/djgear-device-catalog:ro
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      # Isolated from backend services (mysql, redis, mailpit)
      - djgear_frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
    name: djgear_mysql_data
  redis_data:
    name: djgear_redis_data
  wp_core:
    name: djgear_wp_core
  wp_uploads:
    name: djgear_wp_uploads

networks:
  djgear_frontend:
    name: djgear_frontend
    driver: bridge
  djgear_backend:
    name: djgear_backend
    driver: bridge
