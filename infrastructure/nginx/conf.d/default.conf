server {
    listen 80 default_server;
    server_name localhost _;

    root /var/www/html;
    index index.php index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Lightweight container healthcheck endpoint
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Block hidden files (.git, .env, .htaccess, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct access to sensitive WordPress files
    location ~* /(?:wp-config\.php|readme\.html|license\.txt|xmlrpc\.php)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Prevent PHP execution inside uploads directory
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # WordPress front controller (supports WooCommerce & REST API permalinks)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Static assets caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # PHP-FPM Upstream
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
