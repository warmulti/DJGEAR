; DJGear PHP-FPM Configuration (WordPress + WooCommerce Baseline)
expose_php = Off
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_time = 120
max_input_vars = 3000
date.timezone = Asia/Tehran

; Error logging (WordPress WP_DEBUG controls runtime display)
log_errors = On
error_log = /proc/self/fd/2

; OPcache tuning for responsive local & staging performance
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
