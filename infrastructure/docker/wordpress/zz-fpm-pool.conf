; DJGear PHP-FPM Pool Overrides & Healthcheck Ping Endpoint
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Internal FastCGI healthcheck endpoint (never exposed publicly via Nginx)
ping.path = /ping
ping.response = pong
pm.status_path = /fpm-status

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
