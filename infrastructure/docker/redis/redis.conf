# DJGear Redis Object Cache Configuration
# Accessible ONLY inside private Docker backend network; password enforced via CLI arg.
bind 0.0.0.0
port 6379
protected-mode yes

# Persistence (AOF + RDB snapshots on persistent volume)
dir /data
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Memory Governance for WordPress/WooCommerce Object Cache
maxmemory 256mb
maxmemory-policy allkeys-lru

# Operational Hygiene
tcp-keepalive 300
timeout 0
loglevel notice
